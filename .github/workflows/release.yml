name: Release bridge

on:
  push:
    tags: ["bridge-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            ext: ""
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - target: darwin-arm64
            runner: macos-latest
            ext: ""
          - target: darwin-x64
            runner: macos-15-intel
            ext: ""
          - target: win-x64
            runner: windows-latest
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/bridge/package.json').version")
          if [ "$GITHUB_REF_NAME" != "bridge-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/bridge version $version" >&2
            exit 1
          fi
      - run: pnpm --filter obnixe-bridge sea
      - run: node apps/bridge/scripts/smoke.mjs apps/bridge/dist/obnixe-bridge-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: obnixe-bridge-${{ matrix.target }}${{ matrix.ext }}
          path: apps/bridge/dist/obnixe-bridge-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: executable
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: obnixe-bridge-*
          merge-multiple: true
      - name: Checksums
        working-directory: binaries
        run: sha256sum obnixe-bridge-* > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Serveur MCP qui permet à un agent IA (Cursor, Claude, tout client MCP) de lire et d'enregistrer l'entraînement dans l'application Obnixe du téléphone. Chaque fichier est un exécutable autonome : Node.js n'est pas nécessaire.

          Range d'abord le fichier à son emplacement définitif : `install` enregistre ce chemin exact dans la configuration MCP de chaque client trouvé (Cursor, Claude Desktop, Claude Code). Redémarre ensuite le client, puis lance `pair` et scanne le QR code depuis l'écran Agent du téléphone.

          ### Windows (x64)

          Télécharge `obnixe-bridge-win-x64.exe`. Le fichier n'est pas signé : si Windows SmartScreen l'arrête, clique sur « Informations complémentaires » puis « Exécuter quand même ». Dans PowerShell :

          ```
          .\obnixe-bridge-win-x64.exe install
          ```

          ### macOS (Apple Silicon : darwin-arm64, Intel : darwin-x64)

          Le fichier n'est pas signé par un développeur identifié : retire l'attribut de quarantaine avant de le lancer.

          ```
          chmod +x ./obnixe-bridge-darwin-arm64
          xattr -d com.apple.quarantine ./obnixe-bridge-darwin-arm64
          ./obnixe-bridge-darwin-arm64 install
          ```

          ### Linux (x64, arm64)

          ```
          chmod +x ./obnixe-bridge-linux-x64
          ./obnixe-bridge-linux-x64 install
          ```

          `install --dry-run` montre ce qui serait écrit sans rien modifier, `install --client cursor|claude-desktop|claude-code` cible un seul client et `uninstall` retire l'entrée. Les empreintes SHA-256 sont dans `SHA256SUMS` (`sha256sum -c SHA256SUMS --ignore-missing`).
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" binaries/* --repo "$GITHUB_REPOSITORY" --title "obnixe-bridge ${GITHUB_REF_NAME#bridge-v}" --notes-file "$RUNNER_TEMP/notes.md"
