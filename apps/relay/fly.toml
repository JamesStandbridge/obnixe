# Deploy from the repository root: fly deploy --config apps/relay/fly.toml --dockerfile apps/relay/Dockerfile .
# Rooms live in memory, so the app must run exactly one machine: fly scale count 1.
app = "obnixe-relay"
primary_region = "cdg"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 9000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
