plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.obnixe'
version = '1.0.0'

android {
  namespace "app.obnixe.remote"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core:1.16.0"
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
