plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.obnixe'
version = '1.0.0'

android {
  namespace "app.obnixe.maps"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  compileOnly "org.maplibre.gl:android-sdk-opengl:13.6.1"
  compileOnly "com.squareup.okhttp3:okhttp:4.12.0"
}
