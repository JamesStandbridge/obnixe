<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>Obnixe — Progression</title>
<link rel="stylesheet" href="system.css">
<style>
  .subject { margin-top: 14px; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px 0 10px; border-radius: var(--r-panel); background: var(--surface); text-align: left; }
  .subject strong { font-weight: 700; font-size: 18px; display: block; }
  .subject small { color: var(--text-2); font-size: 13px; }
  .subject:active { background: var(--surface-press); }
  .subject:has([data-ref="subject-icon"][hidden]) { grid-template-columns: minmax(0, 1fr) auto; padding-left: 14px; }
  .metrics { margin-top: 10px; }
  .metric-note { margin-top: 8px; font-size: 13px; color: var(--text-2); line-height: 1.4; }

  .readout { margin-top: 18px; display: grid; gap: 6px; }
  .readout .value { display: flex; align-items: baseline; gap: 8px; }
  .readout .value strong { font: 800 64px/0.9 var(--font-figure); letter-spacing: -0.02em; }
  .readout .value span { font: 600 15px/1 var(--font-text); color: var(--text-2); }
  .readout .context { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--text-2); min-height: 20px; }
  .readout .context > span { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .readout .context a { color: var(--text); font-weight: 600; white-space: nowrap; min-height: 44px; display: inline-flex; align-items: center; margin: -12px 0; }
  .readout .delta { font: 700 17px/1.2 var(--font-figure); }
  .readout .delta span { color: var(--text-2); font-weight: 600; }

  .chart { margin-top: 8px; position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; border-radius: 4px; }
  .grid-line { stroke: var(--line); stroke-width: 1; }
  .axis-label { fill: var(--text-3); font: 600 12px var(--font-figure); }
  .series { fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .series.is-step { stroke-linejoin: miter; stroke-linecap: square; }
  .dot { fill: var(--text); }
  .dot.is-unreliable { fill: var(--bg); stroke: var(--text-2); stroke-width: 1.5; }
  .record { fill: var(--bg); stroke: var(--text); stroke-width: 2; }
  .bar { fill: var(--step-done); }
  .bar.is-selected { fill: var(--text); }
  .suspended { fill: var(--text); opacity: 0.05; }
  .suspended-label { fill: var(--text-2); font: 600 12px var(--font-text); }
  .event-line { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 2 3; }
  .event-tag rect { fill: var(--bg); stroke: var(--line); }
  .event-tag text { fill: var(--text-2); font: 700 11px var(--font-figure); }
  .cursor-line { stroke: var(--text-2); stroke-width: 1; }
  .cursor-ring { fill: var(--bg); stroke: var(--hv-mark); stroke-width: 2.5; }
  .pain-ring { fill: none; stroke: var(--warn); stroke-width: 2; }
  .pain-square { fill: var(--stop); }
  .pain-base { stroke: var(--line); stroke-width: 1; }
  .strip-label { fill: var(--text-3); font: 600 11px var(--font-text); }

  .ranges { margin-top: 14px; --options: 4; }
  .ranges button { min-height: 44px; }
  .chart-legend { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-2); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend i { flex: none; }
  .chart-legend i.dot-key { width: 6px; height: 6px; border-radius: 50%; background: var(--text); }
  .chart-legend i.unreliable-key { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--text-2); }
  .chart-legend i.record-key { width: 9px; height: 9px; box-shadow: inset 0 0 0 2px var(--text); }
  .chart-legend i.event-key { width: 0; height: 14px; border-left: 1px dashed var(--text-3); }
  .chart-legend i.bar-key { width: 10px; height: 12px; border-radius: 2px; background: var(--step-done); }
  .chart-legend i.suspended-key { width: 14px; height: 12px; border-radius: 2px; background: color-mix(in oklch, var(--text) 10%, transparent); }

  .data-table { margin-top: 14px; border-top: 1px solid var(--line); }
  .data-table summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; cursor: pointer; list-style: none; }
  .data-table summary::-webkit-details-marker { display: none; }
  .data-table summary svg { transition: transform var(--dur-press) var(--ease-out); }
  .data-table[open] summary svg { transform: rotate(180deg); }
  .data-table .table-scroll { max-height: 320px; overflow-y: auto; }
  .data-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .data-table th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 600; color: var(--text-3); font-size: 12px; padding: 6px 0; }
  .data-table td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .data-table td:nth-child(2), .data-table th:nth-child(2) { text-align: right; padding-right: 14px; font-family: var(--font-figure); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .data-table td:nth-child(3) { color: var(--text-2); }
  .data-table td .pain-mark { margin-right: 4px; }

  .pyramid { margin-top: 18px; display: grid; gap: 6px; }
  .pyramid .level { display: grid; grid-template-columns: 40px minmax(0, 1fr) 28px; align-items: center; gap: 10px; }
  .pyramid .level b { font: 700 17px/1 var(--font-figure); text-align: right; }
  .pyramid .level small { font: 700 15px/1 var(--font-figure); color: var(--text-2); text-align: right; }
  .pyramid .bars { display: flex; height: 22px; gap: 2px; }
  .pyramid .bars i { display: block; height: 100%; border-radius: 3px; }
  .pyramid .flash { background: var(--text); }
  .pyramid .sent { background: var(--step-done); }
  .pyramid .project { box-shadow: inset 0 0 0 1.5px var(--control-border); }
  .chart-legend i.flash-key, .chart-legend i.sent-key, .chart-legend i.project-key { width: 12px; height: 12px; border-radius: 3px; }
  .chart-legend i.flash-key { background: var(--text); }
  .chart-legend i.sent-key { background: var(--step-done); }
  .chart-legend i.project-key { box-shadow: inset 0 0 0 1.5px var(--control-border); }

  .empty { margin-top: 24px; padding: 20px 16px; border-radius: var(--r-panel); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 6px; }
  .empty strong { font-weight: 700; }
  .empty p { color: var(--text-2); font-size: 14px; line-height: 1.45; }

  .history .row { grid-template-columns: minmax(0, 1fr) auto; }
  .history .row-value { font-size: 17px; }
  .history small { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .subject-list button { display: grid; grid-template-columns: minmax(0, 1fr) 72px; align-items: center; gap: 12px; width: 100%; min-height: 60px; border-top: 1px solid var(--line); text-align: left; }
  .subject-list button[aria-pressed="true"] strong { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
  .subject-list strong { font-weight: 600; font-size: 16px; display: block; }
  .subject-list small { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .subject-list svg.spark-box { width: 72px; height: 24px; }
  .subject-list .spark { fill: none; stroke: var(--text-2); stroke-width: 1.75; stroke-linejoin: round; }
  .subject-list .group { margin-top: 18px; display: flex; align-items: center; gap: 8px; font: 700 14px/1 var(--font-text); color: var(--text); padding-bottom: 8px; }
  .subject-list .subgroup { margin-top: 10px; font: 600 12px/1 var(--font-text); color: var(--text-3); padding-bottom: 6px; }
  .sheet-scroll { max-height: 64dvh; overflow-y: auto; margin: 0 -20px; padding: 0 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="screen">
  <div class="appbar">
    <h1>Journal</h1>
  </div>
  <nav class="view-switch" data-journal-view="progress" aria-label="Vue du journal"></nav>

  <button class="subject" data-ref="subject" data-sheet-open="subjects" aria-haspopup="dialog">
    <span class="sport-icon is-filled" data-ref="subject-icon" aria-hidden="true"></span>
    <span><strong data-ref="subject-name"></strong><small data-ref="subject-meta"></small></span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>
  </button>
  <div class="segmented metrics" data-ref="metrics" role="group" aria-label="Mesure"></div>
  <p class="metric-note" data-ref="metric-note"></p>

  <section data-ref="chart-view">
    <div class="readout" aria-live="polite">
      <div class="value"><strong data-ref="readout-value"></strong><span data-ref="readout-unit"></span></div>
      <div class="context"><span data-ref="readout-context"></span><a data-ref="readout-link" href="session.html">Voir la séance</a></div>
      <p class="delta" data-ref="readout-delta"></p>
    </div>
    <div class="chart" data-ref="chart" tabindex="0" role="slider" aria-label="Graphique : flèches pour parcourir, Début et Fin pour les extrémités"></div>
  </section>

  <section data-ref="pyramid-view" hidden>
    <div class="pyramid" data-ref="pyramid"></div>
  </section>

  <div class="empty" data-ref="empty" hidden>
    <strong data-ref="empty-title"></strong>
    <p data-ref="empty-text"></p>
  </div>

  <div class="segmented ranges" data-ref="ranges" role="group" aria-label="Période">
    <button data-value="28">4 sem.</button>
    <button data-value="84">12 sem.</button>
    <button data-value="182">6 mois</button>
    <button data-value="365">1 an</button>
  </div>
  <div class="chart-legend" data-ref="legend"></div>

  <details class="data-table" data-ref="data-table">
    <summary>Voir les données<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></summary>
    <div class="table-scroll"><table data-ref="table"></table></div>
  </details>

  <section class="section history" data-ref="history-section">
    <div class="section-head"><span class="section-title" data-ref="history-title">Dernières séances</span></div>
    <div data-ref="history"></div>
  </section>
</main>

<div class="bottom">
  <nav class="tabbar" data-tabbar="journal" aria-label="Navigation principale"></nav>
</div>

<div class="sheet-root" data-sheet="subjects" data-open="false">
  <div class="scrim" data-sheet-close="subjects"></div>
  <section class="sheet" role="dialog" aria-label="Que suivre ?">
    <div class="grabber"></div>
    <h2>Que suivre ?</h2>
    <div class="sheet-scroll"><div class="subject-list" data-ref="subject-list"></div></div>
  </section>
</div>

<script src="system.js"></script>
<script src="fixtures.js"></script>
<script>
  const DAY = FIXTURE_DAY_MS;
  const today = fixtureToday;
  const monthShort = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const monthLong = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const weekdayShort = ["Dim.", "Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam."];
  const weekdayLong = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  const rangeWords = { 28: "4 semaines", 84: "12 semaines", 182: "6 mois", 365: "1 an" };
  const levelWords = { discomfort: "gêne", stop: "arrêt" };
  const zoneWords = { "Épaule droite": "à l'épaule droite", "Genou droit": "au genou droit", "Doigts, main droite": "aux doigts" };

  const longDate = (date) => `${weekdayLong[date.getDay()]} ${date.getDate()} ${monthLong[date.getMonth()]}`;
  const shortDate = (date) => `${date.getDate()} ${monthShort[date.getMonth()]}`;
  const rowDate = (date) => `${weekdayShort[date.getDay()]} ${date.getDate()} ${monthShort[date.getMonth()]}`;
  const formatPace = (seconds) => `${Math.floor(seconds / 60)}:${String(Math.round(seconds % 60)).padStart(2, "0")}`;
  const formatKm = (km) => km.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const signed = (value, format) => `${value > 0 ? "+" : value < 0 ? "−" : ""}${format(Math.abs(value))}`;
  const painMark = (level) => `<i class="pain-mark" data-level="${level}"></i>`;
  const e1rm = (set) => set.load * (1 + (set.reps + set.rir) / 30);
  const isUnreliable = (set) => set.reps + set.rir > 12;

  const liftSessions = fixtureSessions.filter((session) => session.sport === "lift");
  const runSessions = fixtureSessions.filter((session) => session.sport === "run");
  const climbSessions = fixtureSessions.filter((session) => session.sport === "climb");

  function weekly(valueOf) {
    const weeks = [];
    for (let monday = fixtureMonday(fixtureAddDays(today, -371)); monday <= today; monday = fixtureAddDays(monday, 7)) {
      const end = fixtureAddDays(monday, 7);
      const inWeek = fixtureSessions.filter((session) => session.date >= monday && session.date < end);
      weeks.push({ date: monday, center: fixtureAddDays(monday, 3.5), ...valueOf(inWeek, monday) });
    }
    return weeks;
  }

  function exercisePoints(exercise, metric) {
    return liftSessions
      .filter((session) => session.sets?.[exercise.id])
      .map((session) => {
        const set = session.sets[exercise.id];
        const value = metric.value(set);
        const detail = `${exercise.kind === "reps" ? `${set.reps} rép.` : `${formatNumber(set.load)} × ${set.reps}`} · RIR ${set.rir}${set.interrupted ? " · interrompu" : ""}`;
        return { date: session.date, value, detail, href: "session.html", unreliable: metric.id === "e1rm" && isUnreliable(set) };
      });
  }

  const loadMetrics = [
    { id: "e1rm", label: "1RM estimé", unit: "kg", note: "RIR compris", value: (set) => Math.round(e1rm(set)), format: formatNumber, better: "higher" },
    { id: "load", label: "Charge", unit: "kg", note: "Meilleure série", value: (set) => set.load, format: formatNumber, better: "higher" },
    { id: "volume", label: "Volume", unit: "kg", note: "Toutes les séries", value: (set) => Math.round(set.load * set.reps * set.sets * 0.95), format: (value) => value.toLocaleString("fr-FR"), better: "higher" },
  ];
  const repsMetrics = [
    { id: "best", label: "Meilleure série", unit: "rép.", note: "Poids du corps", value: (set) => set.reps, format: String, better: "higher" },
    { id: "volume", label: "Volume", unit: "rép.", note: "Toutes les séries", value: (set) => Math.round(set.reps * set.sets * 0.9), format: String, better: "higher" },
  ];

  function exerciseSubject(exercise) {
    const metrics = exercise.kind === "reps" ? repsMetrics : loadMetrics;
    const sample = liftSessions.filter((session) => session.sets?.[exercise.id]).map((session) => session.sets[exercise.id]);
    const defaultMetric = exercise.kind === "load" && sample.filter(isUnreliable).length > sample.length / 2 ? "load" : metrics[0].id;
    const last = liftSessions.filter((session) => session.sets?.[exercise.id]).pop();
    return {
      id: exercise.id,
      group: "lift",
      subgroup: `Séance ${exercise.block}`,
      icon: "lift",
      name: exercise.name,
      meta: exercise.added ? "ajouté en v7" : exercise.retired ? "retiré en v7" : (last ? `dernière : ${rowDate(last.date).toLowerCase()}` : ""),
      metaPain: exercise.id === "bench" ? "stop" : null,
      metrics,
      defaultMetric,
      zone: exercise.zone,
      touches: (event) => event.touches.includes(exercise.id),
      suspension: fixtureSuspensions.find((item) => item.exercise === exercise.id) ?? null,
      historyTitle: "Dernières séances",
      emptyText: exercise.added ? { title: "Pas encore de séance", text: "Ajouté en v7, à la prochaine séance B." } : null,
      series(metricId) {
        const metric = metrics.find((item) => item.id === metricId);
        return { kind: "line", unit: metric.unit, format: metric.format, better: metric.better, points: exercisePoints(exercise, metric), note: metric.note };
      },
    };
  }

  const runSubject = {
    id: "run",
    group: "run",
    icon: "run",
    name: "Course",
    meta: `${runSessions.length} sorties sur un an`,
    metrics: [{ id: "distance", label: "Distance / sem." }, { id: "pace", label: "Allure en footing" }],
    defaultMetric: "distance",
    zone: "Genou droit",
    touches: (event) => event.touches.includes("run"),
    historyTitle: "Dernières semaines",
    series(metricId) {
      if (metricId === "distance") {
        const weeks = weekly((sessions) => {
          const runs = sessions.filter((session) => session.sport === "run");
          return { value: Math.round(runs.reduce((sum, run) => sum + run.km, 0) * 10) / 10, runs: runs.length };
        });
        return {
          kind: "bars",
          unit: "km",
          format: formatKm,
          better: null,
          points: weeks.map((week) => ({ date: week.center, week: week.date, value: week.value, detail: `${week.runs} sortie${week.runs > 1 ? "s" : ""}`, label: `semaine du ${shortDate(week.date)}`, href: null })),
          note: "",
        };
      }
      return {
        kind: "line",
        unit: "/km",
        format: formatPace,
        better: "lower",
        points: runSessions.filter((run) => run.kind === "footing").map((run) => ({ date: run.date, value: run.pace, detail: `${formatKm(run.km)} km`, href: "session.html?sport=run" })),
        note: "Footings seulement",
      };
    },
  };

  const climbSubject = {
    id: "climb",
    group: "climb",
    icon: "climb",
    name: "Bloc",
    meta: `${climbSessions.length} séances sur un an`,
    metrics: [{ id: "max", label: "Cotation max" }, { id: "pyramid", label: "Pyramide" }],
    defaultMetric: "max",
    zone: "Doigts, main droite",
    touches: () => false,
    historyTitle: "Dernières séances",
    series() {
      return {
        kind: "step",
        unit: "",
        format: (value) => fixtureGrades[value],
        better: "higher",
        grades: true,
        points: climbSessions.map((climb) => ({ date: climb.date, value: climb.maxGrade, detail: climb.detail, href: "session.html?sport=climb" })),
        note: "",
      };
    },
  };

  const weightSubject = {
    id: "weight",
    group: "body",
    icon: null,
    name: "Poids",
    meta: `dernière pesée : ${formatNumber(fixtureWeighins.at(-1).kg)} kg`,
    metrics: [{ id: "avg", label: "Moyenne 7 jours" }, { id: "raw", label: "Pesées" }],
    defaultMetric: "avg",
    zone: null,
    touches: () => false,
    historyTitle: "Dernières pesées",
    trendWords: (metricId, delta) => (delta === 0 ? "Stable" : `${signed(delta, formatNumber)} kg`),
    series(metricId) {
      const points = fixtureWeighins.map((weighin) => {
        if (metricId === "raw") return { date: weighin.date, value: weighin.kg, detail: "pesée", href: "body.html" };
        const window = fixtureWeighins.filter((item) => item.date <= weighin.date && item.date > fixtureAddDays(weighin.date, -7));
        const average = Math.round((window.reduce((sum, item) => sum + item.kg, 0) / window.length) * 10) / 10;
        return { date: weighin.date, value: average, detail: `${window.length} pesée${window.length > 1 ? "s" : ""}`, href: "body.html" };
      });
      return { kind: "line", unit: "kg", format: formatNumber, better: null, points, note: "" };
    },
  };

  const checkinSubject = {
    id: "checkin",
    group: "checkin",
    icon: null,
    name: "Énergie et sommeil",
    meta: "check-ins depuis le 31 août",
    metrics: [{ id: "energy", label: "Énergie" }, { id: "sleep", label: "Sommeil" }],
    defaultMetric: "energy",
    zone: null,
    touches: () => false,
    historyTitle: "Derniers check-ins",
    trendWords(metricId, delta) {
      const label = metricId === "energy" ? "Énergie" : "Sommeil";
      if (delta === 0) return `${label} stable`;
      const amount = metricId === "energy" ? `${formatNumber(Math.abs(delta))} point${Math.abs(delta) >= 2 ? "s" : ""}` : `${formatNumber(Math.abs(delta))} h`;
      return `${label} en ${delta > 0 ? "hausse" : "baisse"} de ${amount}`;
    },
    series(metricId) {
      const isEnergy = metricId === "energy";
      return {
        kind: "line",
        unit: isEnergy ? "/ 5" : "h",
        format: (value) => (!isEnergy && value < 6 ? "< 6" : formatNumber(value)),
        better: null,
        fixedDomain: isEnergy ? [1, 5] : [4, 9],
        points: fixtureCheckins.map((checkin) => ({ date: checkin.date, value: isEnergy ? checkin.energy : checkin.sleep, detail: "check-in", href: "body.html" })),
        note: "",
      };
    },
  };

  function painDays(pains) {
    const byDay = new Map();
    pains.forEach((pain) => {
      const iso = fixtureIso(pain.date);
      const known = byDay.get(iso);
      byDay.set(iso, { date: pain.date, level: known?.level === "stop" || pain.level === "stop" ? "stop" : "discomfort" });
    });
    return [...byDay.values()];
  }

  function painSubject(id, zone, name, loadLabel, loadUnit, loadOf, loadNote) {
    const pains = fixturePains(zone);
    return {
      id,
      group: "pain",
      icon: null,
      name,
      meta: `${pains.length} signalement${pains.length > 1 ? "s" : ""} · charge : ${loadLabel}`,
      metaPain: pains.at(-1)?.level ?? null,
      metrics: [{ id: "load", label: loadLabel }],
      defaultMetric: "load",
      zone,
      touches: () => false,
      historyTitle: "Derniers signalements",
      painHistory: true,
      series() {
        const weeks = weekly((sessions, monday) => {
          const end = fixtureAddDays(monday, 7);
          const weekPains = painDays(pains.filter((pain) => pain.date >= monday && pain.date < end));
          return { value: loadOf(sessions), pains: weekPains };
        });
        return {
          kind: "bars",
          unit: loadUnit,
          format: (value) => formatNumber(value),
          better: null,
          points: weeks.map((week) => ({ date: week.center, week: week.date, value: week.value, weekPains: week.pains, detail: week.pains.length ? week.pains.map((pain) => `${painMark(pain.level)}${levelWords[pain.level]} ${rowDate(pain.date).toLowerCase()}`).join(" · ") : "aucune douleur", label: `semaine du ${shortDate(week.date)}`, href: null })),
          note: loadNote,
        };
      },
    };
  }

  const pressingIds = fixtureExercises.filter((exercise) => exercise.pressing).map((exercise) => exercise.id);
  const subjects = [
    ...fixtureExercises.map(exerciseSubject),
    runSubject,
    climbSubject,
    weightSubject,
    checkinSubject,
    painSubject("pain-shoulder", "Épaule droite", "Épaule droite", "Séries de poussée", "séries", (sessions) => sessions.reduce((sum, session) => sum + pressingIds.reduce((count, id) => count + (session.sets?.[id]?.sets ?? 0), 0), 0), "Développés et tirage menton"),
    painSubject("pain-knee", "Genou droit", "Genou droit", "Km de course", "km", (sessions) => Math.round(sessions.filter((session) => session.sport === "run").reduce((sum, run) => sum + run.km, 0) * 10) / 10, ""),
    painSubject("pain-fingers", "Doigts, main droite", "Doigts, main droite", "Blocs", "blocs", (sessions) => sessions.filter((session) => session.sport === "climb").reduce((sum, climb) => sum + climb.blocs, 0), ""),
  ];
  const groups = [
    { id: "lift", label: "Musculation", icon: "lift" },
    { id: "run", label: "Course", icon: "run" },
    { id: "climb", label: "Escalade", icon: "climb" },
    { id: "body", label: "Corps", icon: null },
    { id: "checkin", label: "Check-in", icon: null },
    { id: "pain", label: "Douleurs", icon: null },
  ];

  const params = new URLSearchParams(location.search);
  const sportSubject = { run: "run", climb: "climb", lift: "bench" };
  const initialSubject = params.get("exercise") ?? params.get("subject") ?? sportSubject[params.get("sport")] ?? "bench";
  const state = { subject: subjects.find((subject) => subject.id === initialSubject)?.id ?? "bench", metric: {}, range: 84, selected: null };

  const currentSubject = () => subjects.find((subject) => subject.id === state.subject);
  const currentMetric = () => state.metric[state.subject] ?? currentSubject().defaultMetric;

  function visiblePoints(series) {
    const from = today.getTime() - state.range * DAY;
    return series.points
      .map((point, index) => ({ ...point, isRecord: series.better !== null && !point.unreliable && index > 0 && series.points.slice(0, index).filter((previous) => !previous.unreliable).every((previous) => (series.better === "higher" ? point.value > previous.value : point.value < previous.value)) }))
      .filter((point) => point.date.getTime() >= from && point.date <= today);
  }

  function niceTicks(min, max, count) {
    const span = max - min || 1;
    const raw = span / count;
    const magnitude = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map((factor) => factor * magnitude).find((candidate) => candidate >= raw);
    const start = Math.floor(min / step) * step;
    const end = Math.ceil(max / step) * step;
    const ticks = [];
    for (let value = start; value <= end + step / 2; value += step) ticks.push(Math.round(value * 100) / 100);
    return ticks;
  }

  function timeTicks(from, to) {
    const ticks = [];
    if (state.range === 28) {
      for (let date = fixtureMonday(new Date(from)); date <= to; date = fixtureAddDays(date, 7)) if (date.getTime() >= from) ticks.push({ date, label: shortDate(date) });
      return ticks;
    }
    const stride = state.range === 365 ? 2 : 1;
    const start = new Date(from);
    for (let date = new Date(start.getFullYear(), start.getMonth() + 1, 1); date <= to; date = new Date(date.getFullYear(), date.getMonth() + stride, 1)) ticks.push({ date, label: monthShort[date.getMonth()] });
    return ticks;
  }

  function trend(points) {
    if (points.length < 3) return null;
    const xs = points.map((point) => point.date.getTime() / DAY);
    const meanX = xs.reduce((sum, value) => sum + value, 0) / xs.length;
    const meanY = points.reduce((sum, point) => sum + point.value, 0) / points.length;
    const numerator = points.reduce((sum, point, index) => sum + (xs[index] - meanX) * (point.value - meanY), 0);
    const denominator = xs.reduce((sum, value) => sum + (value - meanX) ** 2, 0);
    return (numerator / denominator) * (xs.at(-1) - xs[0]);
  }

  function stripPains(zone, from) {
    const pains = fixturePains(zone);
    return pains.filter((pain) => pain.date.getTime() >= from);
  }

  const W = 358;
  const PLOT_RIGHT = 320;
  const PLOT_TOP = 30;
  const PLOT_BOTTOM = 168;
  const AXIS_Y = 186;

  function renderChart(subject, series, points) {
    const from = today.getTime() - state.range * DAY;
    const span = state.range * DAY;
    const x = (date) => ((date.getTime() - from) / span) * PLOT_RIGHT;
    const hasStrip = Boolean(subject.zone);
    const height = hasStrip ? 240 : 196;

    let min;
    let max;
    if (series.fixedDomain) [min, max] = series.fixedDomain;
    else if (series.grades) {
      min = Math.max(0, Math.min(...points.map((point) => point.value)) - 1);
      max = Math.min(fixtureGrades.length - 1, Math.max(...points.map((point) => point.value)) + 1);
    } else {
      const values = points.map((point) => point.value);
      min = series.kind === "bars" ? 0 : Math.min(...values);
      max = Math.max(...values, series.kind === "bars" ? 1 : -Infinity);
    }
    const ticks = series.grades ? Array.from({ length: max - min + 1 }, (_, index) => min + index) : series.fixedDomain ? niceTicks(min, max, 4).filter((tick) => tick >= min && tick <= max) : niceTicks(min, max, 3);
    const low = series.grades || series.fixedDomain ? min : ticks[0];
    const high = series.grades || series.fixedDomain ? max : ticks.at(-1);
    const invert = series.better === "lower";
    const y = (value) => {
      const ratio = (value - low) / (high - low || 1);
      return invert ? PLOT_TOP + ratio * (PLOT_BOTTOM - PLOT_TOP) : PLOT_BOTTOM - ratio * (PLOT_BOTTOM - PLOT_TOP);
    };

    const parts = [];
    if (subject.suspension && subject.suspension.from.getTime() >= from) {
      const start = x(subject.suspension.from);
      parts.push(`<rect class="suspended" x="${start}" y="${PLOT_TOP}" width="${Math.max(PLOT_RIGHT - start, 4)}" height="${PLOT_BOTTOM - PLOT_TOP}"/>`);
      parts.push(`<text class="suspended-label" x="${PLOT_RIGHT}" y="17" text-anchor="end">${subject.suspension.label}</text>`);
    }
    ticks.forEach((tick) => {
      parts.push(`<line class="grid-line" x1="0" x2="${PLOT_RIGHT}" y1="${y(tick)}" y2="${y(tick)}"/>`);
      parts.push(`<text class="axis-label" x="${W}" y="${y(tick) + 4}" text-anchor="end">${series.format(tick)}</text>`);
    });
    timeTicks(from, today).forEach((tick) => {
      parts.push(`<text class="axis-label" x="${x(tick.date)}" y="${AXIS_Y}" text-anchor="middle">${tick.label}</text>`);
    });

    const events = fixtureProgramEvents.filter((event) => event.date.getTime() >= from && subject.touches(event));
    const clusters = [];
    events.forEach((event) => {
      const last = clusters.at(-1);
      if (last && x(event.date) - x(last.at(-1).date) < 30) last.push(event);
      else clusters.push([event]);
    });
    clusters.forEach((cluster) => {
      cluster.forEach((event) => parts.push(`<line class="event-line" x1="${x(event.date)}" x2="${x(event.date)}" y1="${PLOT_TOP - 6}" y2="${PLOT_BOTTOM}"/>`));
      const label = cluster.length === 1 ? cluster[0].label : `${cluster[0].label}–${cluster.at(-1).label.slice(1)}`;
      const width = label.length * 7 + 10;
      const center = Math.min(PLOT_RIGHT - width / 2, Math.max(width / 2, x(cluster.at(-1).date)));
      parts.push(`<g class="event-tag"><rect x="${center - width / 2}" y="4" width="${width}" height="18" rx="4"/><text x="${center}" y="17" text-anchor="middle">${label}</text></g>`);
    });

    const selected = points[state.selected];
    switch (series.kind) {
      case "bars": {
        const width = Math.max(2, ((7 * DAY) / span) * PLOT_RIGHT - 2);
        points.forEach((point, index) => {
          const top = y(point.value);
          parts.push(`<rect class="bar${index === state.selected ? " is-selected" : ""}" x="${x(point.date) - width / 2}" y="${Math.min(top, PLOT_BOTTOM - (point.value > 0 ? 2 : 0))}" width="${width}" height="${Math.max(PLOT_BOTTOM - top, point.value > 0 ? 2 : 0)}" rx="1.5"/>`);
        });
        break;
      }
      case "line":
      case "step": {
        const path = points.map((point, index) => {
          if (index === 0) return `M${x(point.date)},${y(point.value)}`;
          return series.kind === "step" ? `H${x(point.date)}V${y(point.value)}` : `L${x(point.date)},${y(point.value)}`;
        }).join("");
        parts.push(`<path class="series${series.kind === "step" ? " is-step" : ""}" d="${path}"/>`);
        const showDots = state.range < 84;
        points.forEach((point) => {
          if (point.isRecord) return;
          if (point.unreliable) parts.push(`<circle class="dot is-unreliable" cx="${x(point.date)}" cy="${y(point.value)}" r="3"/>`);
          else if (showDots) parts.push(`<circle class="dot" cx="${x(point.date)}" cy="${y(point.value)}" r="3"/>`);
        });
        points.filter((point) => point.isRecord).forEach((point) => parts.push(`<rect class="record" x="${x(point.date) - 3.5}" y="${y(point.value) - 3.5}" width="7" height="7"/>`));
        break;
      }
      default:
        throw new Error(`Unknown series kind ${series.kind}`);
    }

    if (selected) {
      const cx = x(selected.date);
      parts.push(`<line class="cursor-line" x1="${cx}" x2="${cx}" y1="${PLOT_TOP - 6}" y2="${PLOT_BOTTOM}"/>`);
      if (series.kind !== "bars") parts.push(`<circle class="cursor-ring" cx="${cx}" cy="${y(selected.value)}" r="6"/>`);
    }

    if (hasStrip) {
      const lanes = { session: 214, checkin: 230 };
      parts.push(`<text class="strip-label" x="0" y="200">${subject.zone.toLowerCase()} · séance, check-in</text>`);
      Object.values(lanes).forEach((laneY) => parts.push(`<line class="pain-base" x1="0" x2="${PLOT_RIGHT}" y1="${laneY}" y2="${laneY}"/>`));
      stripPains(subject.zone, from).forEach((pain) => {
        const px = x(pain.date);
        const laneY = lanes[pain.source];
        if (pain.level === "stop") parts.push(`<rect class="pain-square" x="${px - 4}" y="${laneY - 4}" width="8" height="8" rx="1"/>`);
        else parts.push(`<circle class="pain-ring" cx="${px}" cy="${laneY}" r="4" fill="var(--bg)"/>`);
      });
    }

    const chart = ref("chart");
    chart.innerHTML = `<svg viewBox="0 0 ${W} ${height}" aria-hidden="true">${parts.join("")}</svg>`;
    chart.dataset.from = String(from);
    chart.dataset.span = String(span);
    chart.setAttribute("aria-valuemin", "1");
    chart.setAttribute("aria-valuemax", String(points.length));
    chart.setAttribute("aria-valuenow", String(state.selected + 1));
    chart.setAttribute("aria-valuetext", selected ? `${selected.label ?? longDate(selected.date)} : ${series.format(selected.value)} ${series.unit}` : "");
  }

  function renderReadout(subject, series, points) {
    const point = points[state.selected];
    ref("readout-value").textContent = series.format(point.value);
    ref("readout-unit").textContent = series.unit;
    const when = point.label ?? rowDate(point.date);
    const tags = [];
    if (point.isRecord) tags.push("record");
    if (point.unreliable) tags.push("peu fiable");
    ref("readout-context").innerHTML = `${when.charAt(0).toUpperCase()}${when.slice(1)} · ${point.detail}${tags.length ? ` · <strong>${tags.join(" · ")}</strong>` : ""}`;
    ref("readout-link").hidden = !point.href;
    if (point.href) ref("readout-link").href = withTheme(point.href);
    ref("readout-link").textContent = point.href === "body.html" ? "Voir Corps" : "Voir la séance";

    if (subject.painHistory) {
      const count = points.reduce((sum, item) => sum + item.weekPains.length, 0);
      ref("readout-delta").innerHTML = `${count} jour${count > 1 ? "s" : ""} avec douleur <span>sur ${rangeWords[state.range]}</span>`;
      return;
    }
    if (series.kind === "bars") {
      const average = points.reduce((sum, item) => sum + item.value, 0) / points.length;
      ref("readout-delta").innerHTML = `${series.format(Math.round(average * 10) / 10)} ${series.unit} <span>par semaine en moyenne</span>`;
      return;
    }
    if (series.grades) {
      const best = Math.max(...points.map((item) => item.value));
      ref("readout-delta").innerHTML = `${fixtureGrades[best]} <span>au mieux sur ${rangeWords[state.range]}</span>`;
      return;
    }
    const suspendedFrom = subject.suspension?.from.getTime() ?? Infinity;
    const delta = trend(points.filter((item) => !item.unreliable && item.date.getTime() < suspendedFrom));
    if (delta === null) {
      ref("readout-delta").innerHTML = `<span>Pas assez de points pour une tendance</span>`;
      return;
    }
    const rounded = Math.round(delta * 10) / 10;
    if (subject.trendWords) {
      ref("readout-delta").innerHTML = `${subject.trendWords(currentMetric(), rounded)} <span>sur ${rangeWords[state.range]}</span>`;
      return;
    }
    const format = series.better === "lower" ? (value) => formatPace(value) : formatNumber;
    ref("readout-delta").innerHTML = `${signed(rounded, format)} ${series.unit} <span>sur ${rangeWords[state.range]}</span>`;
  }

  function renderLegend(subject, series, points) {
    const items = [];
    if (series.kind === "bars") items.push(`<span><i class="bar-key"></i>${subject.painHistory ? subject.metrics[0].label.toLowerCase() : "par semaine"}</span>`);
    if (series.kind !== "bars" && state.range < 84) items.push(`<span><i class="dot-key"></i>${subject.group === "lift" || subject.group === "run" || subject.group === "climb" ? "séance" : "relevé"}</span>`);
    if (points.some((point) => point.isRecord)) items.push(`<span><i class="record-key"></i>record</span>`);
    if (points.some((point) => point.unreliable)) items.push(`<span><i class="unreliable-key"></i>1RM peu fiable</span>`);
    if (fixtureProgramEvents.some((event) => event.date.getTime() >= today.getTime() - state.range * DAY && subject.touches(event))) items.push(`<span><i class="event-key"></i>version du programme</span>`);
    if (subject.suspension) items.push(`<span><i class="suspended-key"></i>progression suspendue</span>`);
    if (subject.zone) {
      const from = today.getTime() - state.range * DAY;
      const pains = stripPains(subject.zone, from);
      if (pains.some((pain) => pain.level === "discomfort")) items.push(`<span><i class="pain-mark" data-level="discomfort"></i>gêne</span>`);
      if (pains.some((pain) => pain.level === "stop")) items.push(`<span><i class="pain-mark" data-level="stop"></i>arrêt</span>`);
      if (pains.length === 0) items.push(`<span>aucune douleur ${zoneWords[subject.zone]} sur la période</span>`);
    }
    ref("legend").innerHTML = items.join("");
  }

  function renderTable(subject, series, points) {
    const painsByDay = new Map();
    if (subject.zone) fixturePains(subject.zone).forEach((pain) => painsByDay.set(fixtureIso(pain.date), [...(painsByDay.get(fixtureIso(pain.date)) ?? []), pain]));
    const head = subject.painHistory || series.kind === "bars" ? "<th>Semaine</th>" : "<th>Date</th>";
    const rows = [...points].reverse().map((point) => {
      const when = point.week ? `du ${shortDate(point.week)}` : rowDate(point.date);
      let note = point.detail;
      if (!subject.painHistory && !point.week && painsByDay.has(fixtureIso(point.date))) note += ` · ${painsByDay.get(fixtureIso(point.date)).map((pain) => `${painMark(pain.level)}${levelWords[pain.level]}`).join(" ")}`;
      if (point.isRecord) note += " · record";
      if (point.unreliable) note += " · peu fiable";
      return `<tr><td>${when}</td><td>${series.format(point.value)} ${series.unit}</td><td>${note}</td></tr>`;
    });
    ref("table").innerHTML = `<thead><tr>${head}<th>${subject.metrics.find((metric) => metric.id === currentMetric())?.label ?? "Valeur"}</th><th>${subject.zone ? "Détail et douleur" : "Détail"}</th></tr></thead><tbody>${rows.join("")}</tbody>`;
  }

  function renderHistory(subject, series, points) {
    ref("history-title").textContent = subject.historyTitle;
    if (subject.painHistory) {
      const pains = fixturePains(subject.zone).slice(-4).reverse();
      ref("history").innerHTML = pains.length
        ? pains.map((pain) => `<div class="row"><span class="row-main"><strong>${rowDate(pain.date)}</strong><small>${painMark(pain.level)}${levelWords[pain.level]} · ${pain.source === "checkin" ? "au check-in" : "pendant la séance"}</small></span></div>`).join("")
        : `<p class="muted">Aucun signalement.</p>`;
      return;
    }
    ref("history").innerHTML = [...points].slice(-4).reverse().map((point) => {
      const title = point.week ? `Semaine du ${shortDate(point.week)}` : rowDate(point.date);
      const content = `<span class="row-main"><strong>${title}</strong><small>${point.detail}${point.isRecord ? " · record" : ""}</small></span><span class="row-value">${series.format(point.value)}<small>${series.unit}</small></span>`;
      return point.href ? `<a class="row" href="${withTheme(point.href)}">${content}</a>` : `<div class="row">${content}</div>`;
    }).join("");
  }

  function sparkline(subject) {
    const series = subject.series(subject.defaultMetric);
    const points = series.points.slice(-12);
    if (points.length < 2) return `<svg class="spark-box" viewBox="0 0 72 24" aria-hidden="true"></svg>`;
    const values = points.map((point) => point.value);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const invert = series.better === "lower";
    const path = points.map((point, index) => {
      const ratio = (point.value - min) / (max - min || 1);
      return `${index === 0 ? "M" : "L"}${(index / (points.length - 1)) * 70 + 1},${invert ? 3 + ratio * 18 : 21 - ratio * 18}`;
    }).join("");
    return series.kind === "bars"
      ? `<svg class="spark-box" viewBox="0 0 72 24" aria-hidden="true">${points.map((point, index) => `<rect x="${index * 6}" y="${22 - ((point.value - 0) / (max || 1)) * 20}" width="4" height="${((point.value - 0) / (max || 1)) * 20}" fill="var(--text-2)" rx="1"/>`).join("")}</svg>`
      : `<svg class="spark-box" viewBox="0 0 72 24" aria-hidden="true"><path class="spark" d="${path}"/></svg>`;
  }

  function renderSubjectList() {
    const blocks = groups.map((group) => {
      const items = subjects.filter((subject) => subject.group === group.id);
      let subgroup = null;
      const rows = items.map((subject) => {
        const heading = subject.subgroup && subject.subgroup !== subgroup ? `<p class="subgroup">${subject.subgroup}</p>` : "";
        subgroup = subject.subgroup ?? subgroup;
        return `${heading}<button data-subject="${subject.id}" aria-pressed="${subject.id === state.subject}"><span><strong>${subject.name}</strong><small>${subject.metaPain ? painMark(subject.metaPain) : ""}${subject.meta}</small></span>${sparkline(subject)}</button>`;
      });
      return `<p class="group">${group.icon ? `<span class="sport-icon is-inline">${sportIcon(group.icon)}</span>` : ""}${group.label}</p>${rows.join("")}`;
    });
    ref("subject-list").innerHTML = blocks.join("");
    ref("subject-list").querySelectorAll("[data-subject]").forEach((button) => {
      button.addEventListener("click", () => {
        state.subject = button.dataset.subject;
        state.selected = null;
        setSheet("subjects", false);
        render();
      });
    });
  }

  function renderSubject(subject) {
    const group = groups.find((item) => item.id === subject.group);
    ref("subject-icon").innerHTML = subject.icon ? sportIcon(subject.icon) : "";
    ref("subject-icon").hidden = !subject.icon;
    ref("subject-name").textContent = subject.name;
    ref("subject-meta").innerHTML = `${group.label}${subject.subgroup ? ` · ${subject.subgroup.replace("Séance", "séance")}` : ""}`;
    ref("subject").setAttribute("aria-label", `${subject.name}, ${group.label}. Changer ce qui est suivi`);
    const metrics = ref("metrics");
    metrics.hidden = subject.metrics.length < 2;
    metrics.style.setProperty("--options", String(subject.metrics.length));
    metrics.innerHTML = subject.metrics.map((metric) => `<button data-value="${metric.id}" aria-pressed="${metric.id === currentMetric()}">${metric.label}</button>`).join("");
    metrics.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        state.metric[state.subject] = button.dataset.value;
        state.selected = null;
        render();
      });
    });
  }

  function renderPyramid() {
    const from = today.getTime() - state.range * DAY;
    const counts = new Map();
    const add = (grade, key) => {
      const row = counts.get(grade) ?? { flash: 0, sent: 0, project: 0 };
      row[key] += 1;
      counts.set(grade, row);
    };
    climbSessions.filter((climb) => climb.date.getTime() >= from).forEach((climb) => {
      for (let index = 0; index < climb.blocs; index += 1) {
        const grade = Math.max(0, climb.maxGrade - Math.floor(Math.sqrt(index)));
        add(grade, index >= climb.blocs - climb.flashes ? "flash" : "sent");
      }
      add(Math.min(fixtureGrades.length - 1, climb.maxGrade + 1), "project");
    });
    const rows = [...counts.entries()].sort((a, b) => b[0] - a[0]);
    const max = Math.max(...rows.map(([, row]) => row.flash + row.sent + row.project));
    const unit = 100 / max;
    ref("pyramid").innerHTML = rows.map(([grade, row]) => {
      const total = row.flash + row.sent + row.project;
      return `<div class="level" role="img" aria-label="${fixtureGrades[grade]} : ${row.flash} flash, ${row.sent} enchaînés, ${row.project} pas encore"><b>${fixtureGrades[grade]}</b><span class="bars">${row.flash ? `<i class="flash" style="width:${row.flash * unit}%"></i>` : ""}${row.sent ? `<i class="sent" style="width:${row.sent * unit}%"></i>` : ""}${row.project ? `<i class="project" style="width:${row.project * unit}%"></i>` : ""}</span><small>${total}</small></div>`;
    }).join("");
    ref("legend").innerHTML = `<span><i class="flash-key"></i>flash</span><span><i class="sent-key"></i>enchaîné</span><span><i class="project-key"></i>pas encore</span>`;
  }

  function render() {
    const subject = currentSubject();
    renderSubject(subject);
    ref("ranges").querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.value) === state.range)));

    const isPyramid = subject.id === "climb" && currentMetric() === "pyramid";
    ref("pyramid-view").hidden = !isPyramid;
    if (isPyramid) {
      ref("metric-note").hidden = true;
      ref("chart-view").hidden = true;
      ref("empty").hidden = true;
      ref("history-section").hidden = true;
      ref("data-table").hidden = true;
      renderPyramid();
      return;
    }

    const series = subject.series(currentMetric());
    ref("metric-note").textContent = series.note;
    ref("metric-note").hidden = series.note === "";
    const points = visiblePoints(series);
    const isEmpty = points.length === 0;
    ref("chart-view").hidden = isEmpty;
    ref("history-section").hidden = isEmpty;
    ref("data-table").hidden = isEmpty;
    ref("empty").hidden = !isEmpty;
    if (isEmpty) {
      ref("empty-title").textContent = subject.emptyText?.title ?? "Rien sur cette période";
      ref("empty-text").textContent = subject.emptyText?.text ?? "Élargis la période.";
      ref("legend").innerHTML = "";
      return;
    }
    if (state.selected === null || state.selected >= points.length) state.selected = points.length - 1;
    renderChart(subject, series, points);
    renderReadout(subject, series, points);
    renderLegend(subject, series, points);
    renderTable(subject, series, points);
    renderHistory(subject, series, points);
  }

  function refreshSelection() {
    const subject = currentSubject();
    const series = subject.series(currentMetric());
    const points = visiblePoints(series);
    renderChart(subject, series, points);
    renderReadout(subject, series, points);
  }

  function selectAt(clientX) {
    const series = currentSubject().series(currentMetric());
    const points = visiblePoints(series);
    const rect = ref("chart").getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, ((clientX - rect.left) / rect.width) * (W / PLOT_RIGHT)));
    const time = Number(ref("chart").dataset.from) + ratio * Number(ref("chart").dataset.span);
    let nearest = 0;
    points.forEach((point, index) => {
      if (Math.abs(point.date.getTime() - time) < Math.abs(points[nearest].date.getTime() - time)) nearest = index;
    });
    if (nearest !== state.selected) {
      state.selected = nearest;
      refreshSelection();
    }
  }

  const gesture = { id: null, startX: 0, startY: 0, scrubbing: false };
  ref("chart").addEventListener("pointerdown", (event) => {
    gesture.id = event.pointerId;
    gesture.startX = event.clientX;
    gesture.startY = event.clientY;
    gesture.scrubbing = false;
  });
  ref("chart").addEventListener("pointermove", (event) => {
    if (event.pointerId !== gesture.id) return;
    const dx = Math.abs(event.clientX - gesture.startX);
    const dy = Math.abs(event.clientY - gesture.startY);
    if (!gesture.scrubbing && dx > 8 && dx > dy) {
      gesture.scrubbing = true;
      ref("chart").setPointerCapture(event.pointerId);
    }
    if (!gesture.scrubbing && dy > 8) gesture.id = null;
    if (gesture.scrubbing) selectAt(event.clientX);
  });
  ref("chart").addEventListener("pointerup", (event) => {
    if (event.pointerId === gesture.id && !gesture.scrubbing) selectAt(event.clientX);
    gesture.id = null;
  });
  ref("chart").addEventListener("pointercancel", () => {
    gesture.id = null;
  });
  ref("chart").addEventListener("keydown", (event) => {
    const points = visiblePoints(currentSubject().series(currentMetric()));
    const moves = { ArrowLeft: state.selected - 1, ArrowRight: state.selected + 1, Home: 0, End: points.length - 1 };
    if (!(event.key in moves)) return;
    event.preventDefault();
    state.selected = Math.min(points.length - 1, Math.max(0, moves[event.key]));
    refreshSelection();
  });

  ref("ranges").querySelectorAll("button").forEach((button) => {
    button.addEventListener("click", () => {
      state.range = Number(button.dataset.value);
      state.selected = null;
      render();
    });
  });
  ref("subject").addEventListener("click", renderSubjectList);

  render();
</script>
</body>
</html>
