<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>Obnixe — Séance en cours</title>
<link rel="stylesheet" href="system.css">
<style>
  .rest {
    position: sticky; top: 0; z-index: 2;
    height: calc(env(safe-area-inset-top) + 64px);
    padding: env(safe-area-inset-top) 16px 0;
    display: grid; align-content: center; gap: 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    transition: background-color var(--dur-state) var(--ease-out), color var(--dur-state) var(--ease-out);
  }
  .rest-line { display: flex; align-items: baseline; gap: 10px; }
  .rest-figure { font: 800 32px/1 var(--font-figure); letter-spacing: -0.01em; }
  .rest-total { color: var(--text-3); font: 600 18px/1 var(--font-figure); }
  .rest-track { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .rest-track i { display: block; height: 100%; background: var(--hv-mark); transform-origin: left; transition: transform 1s linear; }
  .rest [data-show] { display: none; }
  .rest[data-state="running"] [data-show~="running"],
  .rest[data-state="done"] [data-show~="done"],
  .rest[data-state="active"] [data-show~="active"],
  .rest[data-state="idle"] [data-show~="idle"] { display: revert; }
  .rest[data-state="done"] { background: var(--act-bg); color: var(--act-ink); border-bottom-color: transparent; animation: rest-enter 600ms var(--spring) 1; }
  .rest[data-state="done"] .rest-line { align-items: center; }
  .rest .rest-done-label { font: 700 18px/1 var(--font-text); }
  .rest .push { margin-left: auto; }
  .rest-idle-label { color: var(--text-2); font-weight: 600; }
  @keyframes rest-enter { from { transform: translateY(-6px); } to { transform: translateY(0); } }

  main { padding: 14px 16px calc(env(safe-area-inset-bottom) + 200px); }

  .context, .editing { display: flex; align-items: center; gap: 12px; min-height: 24px; }
  .context { color: var(--text-2); font-weight: 600; font-size: 15px; }
  .context .where { flex: 1; }
  .context .elapsed { font: 600 17px/1 var(--font-figure); }
  .theme-toggle {
    width: 44px; height: 44px; margin: -10px -12px -10px -4px;
    display: grid; place-items: center;
    border-radius: var(--r-control);
    color: var(--text-2);
    transition: background-color var(--dur-press) var(--ease-out);
  }
  .theme-toggle:active { background: var(--surface); }
  .theme-toggle[aria-pressed="true"] { color: var(--text); }
  .editing span { flex: 1; font-weight: 700; font-size: 15px; }
  .editing button { height: 44px; margin: -10px -10px -10px 0; padding: 0 10px; border-radius: var(--r-control); font-weight: 700; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
  .editing button:active { background: var(--surface); }

  .progress { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
  .steps { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; align-items: center; }
  .steps i { height: 4px; border-radius: 2px; background: var(--surface-2); }
  .steps i.done { background: var(--step-done); }
  .steps i.now { height: 6px; border-radius: 3px; background: var(--hv-mark); }
  .steps i.stopped { background: transparent; box-shadow: inset 0 0 0 1.5px var(--stop); }
  .steps-label { font: 700 15px/1 var(--font-figure); color: var(--text-2); }

  .title-button {
    margin: 10px -8px 0; padding: 8px 8px;
    width: calc(100% + 16px);
    display: flex; align-items: center; gap: 6px;
    border-radius: var(--r-control);
    transition: background-color var(--dur-press) var(--ease-out);
  }
  .title-button:active { background: var(--surface); }
  .title-button h1 { font: 700 26px/1.1 var(--font-text); letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-button svg { flex: none; color: var(--text-3); }
  .target { color: var(--text-2); font-size: 15px; }

  .warning:not([hidden]) { height: 48px; padding: 0 2px 0 12px; border-radius: var(--r-control); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--stop); display: flex; align-items: center; gap: 8px; }
  .warning:not([hidden]) + .track { margin-top: 12px; }
  .warning span { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .warning button { height: 44px; padding: 0 12px; border-radius: 6px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; transition: background-color var(--dur-press) var(--ease-out); }
  .warning button:active { background: var(--surface-press); }

  .track { margin-top: 16px; display: grid; grid-template-columns: repeat(var(--count), minmax(0, 1fr)); gap: 2px; border-radius: var(--r-panel); overflow: hidden; }
  .track.is-scrollable { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 96px; overflow-x: auto; scrollbar-width: none; }
  .set { background: var(--surface); padding: 10px 12px; display: grid; align-content: start; gap: 5px; height: 76px; }
  .set-label { display: flex; align-items: center; gap: 6px; font: 700 12px/1 var(--font-text); letter-spacing: 0.04em; color: var(--text-2); }
  .set strong { font: 700 21px/1 var(--font-figure); }
  .set small { color: var(--text-2); font-size: 13px; line-height: 1; white-space: nowrap; }
  button.set { transition: background-color var(--dur-press) var(--ease-out); }
  button.set:active { background: var(--surface-press); }
  .set.is-current { background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--hv-mark); }
  .set.is-current .set-label { color: var(--text); }
  .set.is-current strong, .set.is-todo strong { font: 700 17px/21px var(--font-text); }
  .set.is-todo strong { color: var(--text-3); font-weight: 600; }
  .set.is-interrupted strong { font: 600 17px/21px var(--font-text); color: var(--text-2); }
  .set.is-editing { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--text); }

  .readout { margin-top: 20px; display: grid; gap: 16px; }
  .comparison { padding: 0 4px; font-size: 14px; line-height: 1.35; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comparison .pain-mark { margin-right: 6px; vertical-align: 1px; }
  .comparison b { color: var(--text); font-weight: 700; font-size: 15px; }

  .rir { display: grid; gap: 8px; }
  .rir-scale button span { font-size: 21px; }

  .finished { margin-top: 24px; padding: 18px; border-radius: var(--r-panel); background: var(--surface); display: grid; gap: 6px; }
  .finished strong { font: 700 22px/1.15 var(--font-text); }
  .finished p { color: var(--text-2); }

  .upnext { margin-top: 32px; display: grid; }
  .upnext .section-title { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .upnext-row { display: grid; grid-template-columns: 26px 1fr auto; align-items: baseline; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .upnext-row:last-child { border-bottom: 0; }
  .upnext-row > span:first-child { color: var(--text-3); font: 700 15px/1 var(--font-figure); }
  .upnext-row > span:nth-child(2) { font-weight: 500; display: grid; gap: 4px; }
  .upnext-row > span:last-child { color: var(--text-2); font: 600 16px/1 var(--font-figure); }
  .warn-line { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text); }

  .strip.rest-controls { grid-template-columns: 1fr 1fr 1.4fr; }
  .actions { display: grid; grid-template-columns: 72px 1fr; gap: 10px; }
  .pain-button {
    position: relative;
    height: 64px;
    border-radius: var(--r-panel);
    background: var(--surface);
    box-shadow: inset 0 0 0 1.5px var(--control-border);
    text-align: center;
    font: 700 14px/1 var(--font-text);
    transition: background-color var(--dur-press) var(--ease-out);
  }
  .pain-button:active { background: var(--surface-press); }
  .pain-button [data-ref="pain-indicator"] { position: absolute; top: 9px; right: 9px; display: flex; }
  .primary .icon-edit { display: none; }
  .primary[data-mode="edit"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 2px var(--text); }
  .primary[data-mode="edit"]:active { background: var(--surface-press); }
  .primary[data-mode="edit"] .icon-validate { display: none; }
  .primary[data-mode="edit"] .icon-edit { display: block; }

</style>
</head>
<body>

<div class="rest" data-ref="rest" data-state="running" role="timer" aria-live="polite">
  <div class="rest-line">
    <span class="eyebrow" data-show="running">Repos</span>
    <span class="rest-figure" data-show="running" data-ref="rest-time">1:24</span>
    <span class="rest-total" data-show="running" data-ref="rest-total">/ 2:00</span>
    <span class="rest-done-label" data-show="done">Repos terminé depuis</span>
    <span class="rest-figure push" data-show="done" data-ref="rest-over">0:00</span>
    <span class="eyebrow" data-show="active" data-ref="set-label">Série en cours</span>
    <span class="rest-figure push" data-show="active" data-ref="set-elapsed">0:00</span>
    <span class="rest-idle-label" data-show="idle">Aucun repos en cours</span>
  </div>
  <div class="rest-track" data-show="running"><i data-ref="rest-bar"></i></div>
</div>

<main>
  <div class="context" data-ref="context">
    <span class="where">Séance A · Salle</span>
    <span class="elapsed" data-ref="elapsed">32:14</span>
    <button class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Mode plein soleil">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"/></svg>
    </button>
  </div>
  <div class="editing" data-ref="editing" hidden>
    <span data-ref="editing-label"></span>
    <button data-ref="editing-leave">Quitter la correction</button>
  </div>

  <div class="progress">
    <div class="steps" data-ref="steps" aria-hidden="true"></div>
    <span class="steps-label" data-ref="steps-label"></span>
  </div>

  <button class="title-button" data-ref="title-button" aria-haspopup="dialog">
    <h1 data-ref="title"></h1>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>
  </button>
  <p class="target" data-ref="target"></p>
  <div class="warning" data-ref="warning" role="status" hidden>
    <i class="pain-mark" data-level="stop" aria-hidden="true"></i>
    <span data-ref="warning-text"></span>
    <button data-ref="warning-replace">Remplacer</button>
  </div>

  <div class="track" data-ref="track" aria-label="Séries"></div>

  <section class="readout" data-ref="readout">
    <div class="figure-row">
      <button class="figure" data-open-pad="kg" aria-label="Saisir la charge">
        <strong data-ref="kg"></strong>
        <span data-ref="kg-unit"></span>
      </button>
      <span class="times" aria-hidden="true">×</span>
      <button class="figure" data-open-pad="reps" aria-label="Saisir les répétitions">
        <strong data-ref="reps"></strong>
        <span data-ref="reps-unit"></span>
      </button>
    </div>

    <p class="comparison" data-ref="comparison"></p>

    <div class="adjust">
      <div class="adjust-group">
        <button data-key="kg" data-step="-1"></button>
        <button data-key="kg" data-step="1"></button>
      </div>
      <div class="adjust-group">
        <button data-key="reps" data-step="-1"></button>
        <button data-key="reps" data-step="1"></button>
      </div>
    </div>

    <div class="rir">
      <span class="section-title">Réserve (RIR)</span>
      <div class="scale rir-scale" role="group" aria-label="Répétitions en réserve, de 0 (échec) à 4 et plus (facile)">
        <button data-rir="0" aria-pressed="false"><span>0</span><small>échec</small></button>
        <button data-rir="1" aria-pressed="false"><span>1</span></button>
        <button data-rir="2" aria-pressed="false"><span>2</span></button>
        <button data-rir="3" aria-pressed="false"><span>3</span></button>
        <button data-rir="4+" aria-pressed="false"><span>4+</span><small>facile</small></button>
      </div>
    </div>
  </section>

  <section class="finished" data-ref="finished" hidden>
    <strong>Séance terminée</strong>
    <p>Séries enregistrées.</p>
  </section>

  <section class="upnext" data-ref="upnext">
    <span class="section-title">Ensuite</span>
    <div data-ref="upnext-list"></div>
  </section>
</main>

<div class="bottom">
  <div class="snackbar" data-ref="snackbar" data-open="false" role="status">
    <span data-ref="snackbar-text"></span>
    <button data-ref="snackbar-action">Annuler</button>
  </div>
  <div class="bottom-panel">
    <div class="strip rest-controls" data-ref="rest-controls">
      <button data-rest-add="-15">−15 s</button>
      <button data-rest-add="15">+15 s</button>
      <button data-ref="rest-skip">Passer le repos</button>
    </div>
    <div class="strip" data-ref="start-controls" hidden>
      <button data-ref="start-set">Commencer la série</button>
    </div>
    <div class="actions">
      <button class="pain-button" data-ref="pain-button" aria-haspopup="dialog">
        Douleur
        <span data-ref="pain-indicator"></span>
      </button>
      <button class="primary" data-ref="primary">
        <svg class="icon-validate" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10.5 4 4 8-9"/></svg>
        <svg class="icon-edit" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11.8 3.2 14.8 6.2 6.4 14.6 2.8 15.2 3.4 11.6z"/></svg>
        <span data-ref="primary-label"></span>
      </button>
    </div>
  </div>
</div>

<div class="sheet-root" data-sheet="pain" data-open="false">
  <div class="scrim" data-sheet-close="pain"></div>
  <section class="sheet" role="dialog" aria-label="Signaler une douleur">
    <div class="grabber"></div>
    <div data-ref="pain-step-zones">
      <h2>Signaler une douleur</h2>
      <p class="sheet-context" data-ref="pain-context"></p>
      <div data-ref="pain-zones"></div>
      <button class="other-zone">Autre zone…</button>
      <button class="sheet-primary" data-ref="pain-save">Enregistrer</button>
    </div>
    <div data-ref="pain-step-stop" hidden>
      <h2 data-ref="pain-stop-title"></h2>
      <p class="sheet-context">Douleur enregistrée</p>
      <div class="choices">
        <button class="is-default" data-ref="pain-stop-exercise">Arrêter l'exercice</button>
        <button data-ref="pain-stop-replace">Remplacer l'exercice</button>
        <button data-ref="pain-stop-continue">Continuer quand même</button>
      </div>
    </div>
  </section>
</div>

<div class="sheet-root" data-sheet="pad" data-open="false">
  <div class="scrim" data-sheet-close="pad"></div>
  <section class="sheet" role="dialog" aria-label="Saisir une valeur">
    <div class="grabber"></div>
    <h2 data-ref="pad-title"></h2>
    <div class="pad-display"><strong data-ref="pad-value">0</strong><span data-ref="pad-unit"></span></div>
    <p class="pad-warning" data-ref="pad-warning" hidden></p>
    <div class="pad">
      <button data-pad-key="1">1</button><button data-pad-key="2">2</button><button data-pad-key="3">3</button>
      <button data-pad-key="4">4</button><button data-pad-key="5">5</button><button data-pad-key="6">6</button>
      <button data-pad-key="7">7</button><button data-pad-key="8">8</button><button data-pad-key="9">9</button>
      <button data-pad-key="," data-ref="pad-comma">,</button><button data-pad-key="0">0</button>
      <button data-pad-key="back" aria-label="Effacer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12 9.5 5 5M17 9.5l-5 5"/></svg>
      </button>
    </div>
    <button class="sheet-primary" data-ref="pad-confirm">Utiliser</button>
  </section>
</div>

<div class="sheet-root" data-sheet="exercise" data-open="false">
  <div class="scrim" data-sheet-close="exercise"></div>
  <section class="sheet" role="dialog" aria-label="Exercice">
    <div class="grabber"></div>
    <h2 data-ref="exercise-sheet-title"></h2>
    <div class="menu">
      <button data-sheet-close="exercise"><span>Consignes</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg></button>
      <button data-sheet-close="exercise"><span>Remplacer l'exercice</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg></button>
      <button data-sheet-close="exercise"><span>Historique</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg></button>
    </div>
  </section>
</div>

<script src="system.js"></script>
<script src="instrument.js"></script>
</body>
</html>
